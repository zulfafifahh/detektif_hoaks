name: detektif_hoaks
description: "A new Flutter project."

publish_to: "none"

version: 1.0.1+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.0.2
  supabase_flutter: ^2.5.6
  confetti: ^0.8.0
  audioplayers: ^6.6.0
  shared_preferences: ^2.5.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/logo.png
    - assets/fonts/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/logo.png"

flutter_native_splash:
  color: "#1A237E"
  image: assets/logo.png

  android_12:
    color: "#1A237E"
    image: assets/logo.png
    icon_background_color: "#1A237E" 

  fullscreen: true